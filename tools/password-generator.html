<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator | مولد كلمات المرور المتقدم</title>
    <meta name="description" content="Generate strong passwords with strength indicator and copy button.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh; line-height: 1.7; color: white;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .container { width: 100%; max-width: 550px; }
        .glass-header { background: rgba(255,255,255,0.15); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.3); border-radius: 20px; padding: 30px; text-align: center; margin-bottom: 25px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
        .glass-header .icon { font-size: 3em; margin-bottom: 10px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
        .glass-header h1 { font-size: 1.8em; margin-bottom: 5px; }
        .tool-card { background: rgba(255,255,255,0.15); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.3); border-radius: 20px; padding: 30px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); margin-bottom: 25px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 1em; }
        input[type="text"] { width: 100%; padding: 15px; border: 2px solid rgba(255,255,255,0.4); border-radius: 12px; font-size: 1.1em; background: rgba(255,255,255,0.9); color: #333; text-align: center; direction: ltr; margin-bottom: 15px; }
        .options { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; justify-content: center; }
        .options label { display: flex; align-items: center; gap: 5px; font-size: 0.9em; font-weight: normal; }
        button { width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 12px; font-size: 1.1em; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        button:hover { transform: translateY(-2px); }
        .copy-btn { background: #10b981; }
        .copy-btn:hover { background: #059669; }
        .result { background: rgba(255,255,255,0.95); color: #333; border-radius: 12px; padding: 20px; margin-top: 20px; text-align: center; display: none; animation: fadeIn 0.5s; }
        .result.show { display: block; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
        .result p { font-size: 1.3em; font-weight: bold; color: #667eea; word-break: break-all; font-family: monospace; }
        .strength-bar { width: 100%; height: 10px; background: #e5e7eb; border-radius: 5px; margin: 15px 0; overflow: hidden; }
        .strength-fill { height: 100%; border-radius: 5px; transition: all 0.5s; width: 0%; }
        .strength-text { font-weight: bold; font-size: 0.95em; }
        .info-card { background: rgba(255,255,255,0.15); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.3); border-radius: 20px; padding: 25px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); text-align: center; }
        .info-card h3 { margin-bottom: 15px; }
        .info-card p { opacity: 0.95; font-size: 0.95em; text-align: justify; }
        .back-link { display: inline-block; margin-bottom: 20px; color: white; text-decoration: none; font-weight: bold; padding: 10px 20px; background: rgba(255,255,255,0.2); border-radius: 50px; }
        .footer-text { text-align: center; margin-top: 20px; opacity: 0.8; font-size: 0.9em; }
        .footer-text a { color: white; text-decoration: none; margin: 0 5px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link" data-i18n="back">← Back to Home</a>
        <header class="glass-header">
            <div class="icon">🔐</div>
            <h1 data-i18n="title">Password Generator</h1>
            <p data-i18n="subtitle">Generate strong passwords with strength indicator</p>
        </header>
        <div class="tool-card">
            <label data-i18n="length">Password Length:</label>
            <input type="text" id="passLength" value="12" maxlength="2" placeholder="12">
            <div class="options">
                <label><input type="checkbox" id="useUpper" checked> <span data-i18n="upper">Upper</span></label>
                <label><input type="checkbox" id="useLower" checked> <span data-i18n="lower">Lower</span></label>
                <label><input type="checkbox" id="useNumbers" checked> <span data-i18n="numbers">Numbers</span></label>
                <label><input type="checkbox" id="useSymbols" checked> <span data-i18n="symbols">Symbols</span></label>
            </div>
            <button onclick="generatePassword()" data-i18n="btn">✨ Generate Password</button>
            <div class="result" id="result">
                <p id="passwordText"></p>
                <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                <p class="strength-text" id="strengthText"></p>
                <button class="copy-btn" onclick="copyPassword()" data-i18n="copyBtn">📋 Copy Password</button>
            </div>
        </div>
        <div class="info-card">
            <h3 data-i18n="aboutTitle">About Password Generator</h3>
            <p data-i18n="aboutText">Create strong and secure passwords with our advanced generator. Check the strength indicator and copy instantly.</p>
        </div>
        <div class="footer-text">
            <p data-i18n="footer">© 2026 My Digital Tools</p>
            <p><a href="../privacy-policy.html" data-i18n="privacy">Privacy</a> | <a href="../contact.html" data-i18n="contact">Contact</a></p>
        </div>
    </div>
    <script>
        var translations = {
            en: { back:'← Back to Home', title:'Password Generator', subtitle:'Generate strong passwords', length:'Password Length:', upper:'Upper', lower:'Lower', numbers:'Numbers', symbols:'Symbols', btn:'✨ Generate Password', copyBtn:'📋 Copy Password', aboutTitle:'About Password Generator', aboutText:'Create strong and secure passwords with our advanced generator.', weak:'Weak', medium:'Medium', strong:'Strong', veryStrong:'Very Strong', copied:'✅ Copied to clipboard!', footer:'© 2026 My Digital Tools', privacy:'Privacy', contact:'Contact', error:'⚠️ Please enter a valid length (6-50)' },
            ar: { back:'← العودة للرئيسية', title:'مولد كلمات المرور', subtitle:'أنشئ كلمات مرور قوية', length:'طول كلمة المرور:', upper:'أحرف كبيرة', lower:'أحرف صغيرة', numbers:'أرقام', symbols:'رموز', btn:'✨ توليد كلمة مرور', copyBtn:'📋 نسخ كلمة المرور', aboutTitle:'عن مولد كلمات المرور', aboutText:'أنشئ كلمات مرور قوية وآمنة مع مولدنا المتقدم.', weak:'ضعيفة', medium:'متوسطة', strong:'قوية', veryStrong:'قوية جداً', copied:'✅ تم النسخ!', footer:'© 2026 أدواتي الرقمية', privacy:'الخصوصية', contact:'اتصل بنا', error:'⚠️ الرجاء إدخال طول صحيح (6-50)' },
            fr: { back:'← Retour', title:'Générateur mot de passe', subtitle:'Mots de passe forts', length:'Longueur:', upper:'Majuscules', lower:'Minuscules', numbers:'Chiffres', symbols:'Symboles', btn:'✨ Générer', copyBtn:'📋 Copier', aboutTitle:'À propos', aboutText:'Créez des mots de passe forts avec notre générateur avancé.', weak:'Faible', medium:'Moyen', strong:'Fort', veryStrong:'Très fort', copied:'✅ Copié!', footer:'© 2026 Mes Outils', privacy:'Confidentialité', contact:'Contact', error:'⚠️ Entrez une longueur valide (6-50)' },
            tr: { back:'← Geri', title:'Şifre Oluşturucu', subtitle:'Güçlü şifreler', length:'Şifre Uzunluğu:', upper:'Büyük', lower:'Küçük', numbers:'Rakamlar', symbols:'Semboller', btn:'✨ Şifre Oluştur', copyBtn:'📋 Kopyala', aboutTitle:'Hakkında', aboutText:'Gelişmiş oluşturucumuzla güçlü şifreler oluşturun.', weak:'Zayıf', medium:'Orta', strong:'Güçlü', veryStrong:'Çok Güçlü', copied:'✅ Kopyalandı!', footer:'© 2026 Dijital Araçlar', privacy:'Gizlilik', contact:'İletişim', error:'⚠️ Geçerli uzunluk girin (6-50)' }
        };
        var currentLang = localStorage.getItem('lang') || 'en';
        var currentPassword = '';
        function applyLang(lang) {
            currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(function(el) {
                var key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) el.textContent = translations[lang][key];
            });
            document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
        }
        function generatePassword() {
            var input = document.getElementById('passLength').value.trim();
            var arabic = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
            for (var i = 0; i < 10; i++) input = input.replace(new RegExp(arabic[i], 'g'), i);
            var length = parseInt(input);
            if (isNaN(length) || length < 6 || length > 50) { alert(translations[currentLang].error); return; }
            var upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', lower = 'abcdefghijklmnopqrstuvwxyz', numbers = '0123456789', symbols = '!@#$%^&*()';
            var all = '';
            if (document.getElementById('useUpper').checked) all += upper;
            if (document.getElementById('useLower').checked) all += lower;
            if (document.getElementById('useNumbers').checked) all += numbers;
            if (document.getElementById('useSymbols').checked) all += symbols;
            if (all === '') { alert(translations[currentLang].error); return; }
            currentPassword = '';
            for (var j = 0; j < length; j++) currentPassword += all.charAt(Math.floor(Math.random() * all.length));
            document.getElementById('passwordText').innerText = currentPassword;
            document.getElementById('result').classList.add('show');
            updateStrength(currentPassword, length);
        }
        function updateStrength(password, length) {
            var score = 0;
            if (length >= 8) score++;
            if (length >= 12) score++;
            if (length >= 16) score++;
            if (/[A-Z]/.test(password)) score++;
            if (/[a-z]/.test(password)) score++;
            if (/[0-9]/.test(password)) score++;
            if (/[^A-Za-z0-9]/.test(password)) score++;
            var fill = document.getElementById('strengthFill');
            var text = document.getElementById('strengthText');
            if (score <= 2) { fill.style.width = '25%'; fill.style.background = '#ef4444'; text.textContent = translations[currentLang].weak; }
            else if (score <= 4) { fill.style.width = '50%'; fill.style.background = '#f59e0b'; text.textContent = translations[currentLang].medium; }
            else if (score <= 6) { fill.style.width = '75%'; fill.style.background = '#10b981'; text.textContent = translations[currentLang].strong; }
            else { fill.style.width = '100%'; fill.style.background = '#3b82f6'; text.textContent = translations[currentLang].veryStrong; }
        }
        function copyPassword() {
            if (!currentPassword) return;
            var textarea = document.createElement('textarea');
            textarea.value = currentPassword;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            alert(translations[currentLang].copied);
        }
        applyLang(currentLang);
    </script>
</body>
</html>
