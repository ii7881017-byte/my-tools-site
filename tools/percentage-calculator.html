<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage Calculator | حاسبة النسبة المئوية</title>
    <meta name="description" content="Calculate percentages, increase, decrease and ratio between numbers.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh; line-height: 1.7; color: white;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .container { width: 100%; max-width: 550px; }
        .glass-header { background: rgba(255,255,255,0.15); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.3); border-radius: 20px; padding: 30px; text-align: center; margin-bottom: 25px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
        .glass-header .icon { font-size: 3em; margin-bottom: 10px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
        .glass-header h1 { font-size: 1.8em; margin-bottom: 5px; }
        .tool-card { background: rgba(255,255,255,0.15); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.3); border-radius: 20px; padding: 30px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); margin-bottom: 25px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; text-align: center; }
        input { width: 100%; padding: 15px; border: 2px solid rgba(255,255,255,0.4); border-radius: 12px; font-size: 1.1em; background: rgba(255,255,255,0.15); color: white; text-align: center; direction: ltr; margin-bottom: 15px; }
        input:focus { outline: none; border-color: white; box-shadow: 0 0 20px rgba(255,255,255,0.4); }
        input::placeholder { color: rgba(255,255,255,0.7); }
        button { width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 12px; font-size: 1.1em; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .result { background: rgba(255,255,255,0.95); color: #333; border-radius: 12px; padding: 25px; margin-top: 20px; text-align: center; display: none; animation: fadeIn 0.5s; }
        .result.show { display: block; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
        .result p { font-size: 1.4em; font-weight: bold; color: #667eea; white-space: pre-line; }
        .info-card { background: rgba(255,255,255,0.15); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.3); border-radius: 20px; padding: 25px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); text-align: center; margin-top: 25px; }
        .info-card h3 { margin-bottom: 15px; }
        .info-card p { opacity: 0.95; font-size: 0.95em; text-align: justify; }
        .back-link { display: inline-block; margin-bottom: 20px; color: white; text-decoration: none; font-weight: bold; padding: 10px 20px; background: rgba(255,255,255,0.2); border-radius: 50px; }
        .footer-text { text-align: center; margin-top: 20px; opacity: 0.8; font-size: 0.9em; }
        .footer-text a { color: white; text-decoration: none; margin: 0 5px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link" data-i18n="back">← Back to Home</a>
        <header class="glass-header">
            <div class="icon">💯</div>
            <h1 data-i18n="title">Percentage Calculator</h1>
            <p data-i18n="subtitle">3 functions in one tool</p>
        </header>
        <div class="tool-card">
            <label data-i18n="mode1">1️⃣ What is X% of Y?</label>
            <input type="text" id="percentVal" placeholder="25" maxlength="5">
            <input type="text" id="numberVal" placeholder="200" maxlength="10">
            <button onclick="calcPercent()" data-i18n="calc1">Calculate Percentage</button>
            <div class="result" id="result1"><p id="result1Text"></p></div>
            
            <hr style="margin: 25px 0; border-color: rgba(255,255,255,0.3);">
            
            <label data-i18n="mode2">2️⃣ What % is A of B?</label>
            <input type="text" id="partVal" placeholder="50" maxlength="10">
            <input type="text" id="wholeVal" placeholder="200" maxlength="10">
            <button onclick="calcRatio()" data-i18n="calc2">Calculate Ratio</button>
            <div class="result" id="result2"><p id="result2Text"></p></div>
        </div>
        <div class="info-card">
            <h3 data-i18n="aboutTitle">About Percentage Calculator</h3>
            <p data-i18n="aboutText">Free percentage calculator with 2 modes: calculate X% of a number, and find what percentage one number is of another.</p>
        </div>
        <div class="footer-text">
            <p data-i18n="footer">© 2026 My Digital Tools</p>
            <p><a href="../privacy-policy.html" data-i18n="privacy">Privacy</a> | <a href="../contact.html" data-i18n="contact">Contact</a></p>
        </div>
    </div>
    <script>
        var translations = {
            en: { back:'← Back to Home', title:'Percentage Calculator', subtitle:'3 functions in one', mode1:'1️⃣ What is X% of Y?', calc1:'Calculate Percentage', mode2:'2️⃣ What % is A of B?', calc2:'Calculate Ratio', aboutTitle:'About Percentage Calculator', aboutText:'Free percentage calculator with 2 modes: calculate X% of a number, and find what percentage one number is of another.', result1:'📊 Result:', result2:'📊 Ratio:', footer:'© 2026 My Digital Tools', privacy:'Privacy', contact:'Contact', error:'⚠️ Please enter valid numbers' },
            ar: { back:'← العودة للرئيسية', title:'حاسبة النسبة المئوية', subtitle:'وظيفتان في أداة واحدة', mode1:'1️⃣ كم يساوي X% من Y؟', calc1:'احسب النسبة', mode2:'2️⃣ كم نسبة A من B؟', calc2:'احسب النسبة', aboutTitle:'عن الحاسبة', aboutText:'حاسبة نسبة مئوية مجانية بوضعين: حساب نسبة من رقم، ومعرفة نسبة رقم من رقم آخر.', result1:'📊 النتيجة:', result2:'📊 النسبة:', footer:'© 2026 أدواتي الرقمية', privacy:'الخصوصية', contact:'اتصل بنا', error:'⚠️ الرجاء إدخال أرقام صحيحة' },
            fr: { back:'← Retour', title:'Calculateur %', subtitle:'2 fonctions', mode1:'1️⃣ X% de Y ?', calc1:'Calculer', mode2:'2️⃣ A est quel % de B ?', calc2:'Calculer', aboutTitle:'À propos', aboutText:'Calculateur de pourcentage gratuit avec 2 modes.', result1:'📊 Résultat:', result2:'📊 Ratio:', footer:'© 2026 Mes Outils', privacy:'Confidentialité', contact:'Contact', error:'⚠️ Entrez des nombres valides' },
            tr: { back:'← Geri', title:'Yüzde Hesaplama', subtitle:'2 fonksiyon', mode1:'1️⃣ Y\'nin %X\'i nedir?', calc1:'Hesapla', mode2:'2️⃣ A, B\'nin % kaçı?', calc2:'Hesapla', aboutTitle:'Hakkında', aboutText:'2 modlu ücretsiz yüzde hesaplayıcı.', result1:'📊 Sonuç:', result2:'📊 Oran:', footer:'© 2026 Dijital Araçlar', privacy:'Gizlilik', contact:'İletişim', error:'⚠️ Geçerli sayılar girin' }
        };
        var currentLang = localStorage.getItem('lang') || 'en';
        function applyLang(lang) {
            currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(function(el) {
                var key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) el.textContent = translations[lang][key];
            });
            document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
        }
        function toEnglish(input) {
            var arabic = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
            for (var i = 0; i < 10; i++) input = input.replace(new RegExp(arabic[i], 'g'), i);
            return input;
        }
        function calcPercent() {
            var p = parseFloat(toEnglish(document.getElementById('percentVal').value.trim()));
            var n = parseFloat(toEnglish(document.getElementById('numberVal').value.trim()));
            if (isNaN(p) || isNaN(n)) { alert(translations[currentLang].error); return; }
            var result = (p * n) / 100;
            document.getElementById('result1Text').innerText = translations[currentLang].result1 + '\n\n' + p + '% of ' + n + ' = ' + result;
            document.getElementById('result1').classList.add('show');
        }
        function calcRatio() {
            var a = parseFloat(toEnglish(document.getElementById('partVal').value.trim()));
            var b = parseFloat(toEnglish(document.getElementById('wholeVal').value.trim()));
            if (isNaN(a) || isNaN(b) || b === 0) { alert(translations[currentLang].error); return; }
            var ratio = ((a / b) * 100).toFixed(2);
            document.getElementById('result2Text').innerText = translations[currentLang].result2 + '\n\n' + a + ' is ' + ratio + '% of ' + b;
            document.getElementById('result2').classList.add('show');
        }
        applyLang(currentLang);
    </script>
</body>
</html>
